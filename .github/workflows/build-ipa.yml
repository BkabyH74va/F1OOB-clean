name: Build F1OOB IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Find Xcode project
      run: |
        echo "=== Repository structure ==="
        ls -la
        
        echo ""
        echo "=== Searching for .xcodeproj files ==="
        find . -name "*.xcodeproj" -type d 2>/dev/null
        
        echo ""
        echo "=== Searching for .xcworkspace files ==="
        find . -name "*.xcworkspace" -type d 2>/dev/null
        
        echo ""
        echo "=== Searching for Package.swift ==="
        find . -name "Package.swift" -type f 2>/dev/null
    
    - name: Detect project type and build
      run: |
        # Find Xcode project
        XCODEPROJ=$(find . -name "*.xcodeproj" -type d | head -1)
        WORKSPACE=$(find . -name "*.xcworkspace" -type d | head -1)
        PACKAGE=$(find . -name "Package.swift" -type f | head -1)
        
        if [ ! -z "$WORKSPACE" ]; then
          echo "Found workspace: $WORKSPACE"
          PROJECT_ARG="-workspace $WORKSPACE"
        elif [ ! -z "$XCODEPROJ" ]; then
          echo "Found project: $XCODEPROJ"
          PROJECT_ARG="-project $XCODEPROJ"
        elif [ ! -z "$PACKAGE" ]; then
          echo "Found Swift Package: $PACKAGE"
          echo "Swift Package Manager projects not supported in this workflow"
          exit 1
        else
          echo "Error: No Xcode project, workspace, or Swift Package found"
          echo "Please ensure your project file is committed to the repository"
          exit 1
        fi
        
        # Find scheme (usually matches project name)
        SCHEME=$(basename "$XCODEPROJ" .xcodeproj 2>/dev/null || basename "$WORKSPACE" .xcworkspace 2>/dev/null || echo "F1OOB")
        echo "Using scheme: $SCHEME"
        
        # Build
        xcodebuild \
          $PROJECT_ARG \
          -scheme "$SCHEME" \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -derivedDataPath DerivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          EXPANDED_CODE_SIGN_IDENTITY="" \
          build
    
    - name: Find and verify app
      run: |
        APP_PATH=$(find DerivedData -name "*.app" -type d | head -1)
        if [ -z "$APP_PATH" ]; then
          echo "Error: No .app bundle found"
          exit 1
        fi
        echo "Found app at: $APP_PATH"
        ls -la "$APP_PATH"
        echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
    
    - name: Create IPA
      run: |
        # Create Payload directory
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        
        # Create IPA (unsigned)
        zip -r F1OOB-unsigned.ipa Payload/
        
        # Cleanup
        rm -rf Payload
        
        # Verify IPA
        ls -lh F1OOB-unsigned.ipa
    
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: F1OOB-unsigned-ipa
        path: F1OOB-unsigned.ipa
        retention-days: 7
    
    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          DerivedData/Logs/Build/*.xcactivitylog
          DerivedData/Logs/Build/*.log
