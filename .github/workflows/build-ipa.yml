name: Build F1OOB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13  # Changed from macos-14-arm64 to macos-13 (Intel)
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'  # Use latest stable
    
    - name: Install dependencies
      run: |
        brew install ldid
        brew install dpkg
    
    - name: Build for iOS
      run: |
        xcodebuild -project F1OOB.xcodeproj \
          -scheme F1OOB \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -derivedDataPath DerivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build
    
    - name: Package IPA
      run: |
        # Find the app
        APP_PATH=$(find DerivedData -name "F1OOB.app" -type d | head -1)
        echo "Found app at: $APP_PATH"
        
        # Create Payload directory
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        
        # Zip to IPA
        zip -r F1OOB-unsigned.ipa Payload/
        rm -rf Payload
    
    - name: Upload IPA
      uses: actions/upload-artifact@v3
      with:
        name: F1OOB-unsigned-IPA
        path: F1OOB-unsigned.ipa
