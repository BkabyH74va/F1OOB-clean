name: Build Safe Diagnostics IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "Sources/**"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p F1OOB.xcodeproj
          cat > F1OOB.xcodeproj/project.pbxproj <<'PBXEOF'
          // !$*UTF8*$!
          {
            archiveVersion = 1;
            classes = {};
            objectVersion = 56;
            objects = {
              A00000000000000000000001 = {isa = PBXBuildFile; fileRef = A00000000000000000000002; };
              A00000000000000000000003 = {isa = PBXBuildFile; fileRef = A00000000000000000000004; };
              A00000000000000000000023 = {isa = PBXBuildFile; fileRef = A00000000000000000000005; };
              A00000000000000000000005 = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.objc; path = main.m; sourceTree = "<group>"; };
              A00000000000000000000006 = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
              A00000000000000000000002 = {isa = PBXFileReference; lastKnownFileType = wrapper.framework; name = UIKit.framework; path = System/Library/Frameworks/UIKit.framework; sourceTree = SDKROOT; };
              A00000000000000000000004 = {isa = PBXFileReference; lastKnownFileType = wrapper.framework; name = Metal.framework; path = System/Library/Frameworks/Metal.framework; sourceTree = SDKROOT; };
              A00000000000000000000007 = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = F1OOB.app; sourceTree = BUILT_PRODUCTS_DIR; };
              A00000000000000000000008 = {isa = PBXFrameworksBuildPhase; buildActionMask = 2147483647; files = (A00000000000000000000001, A00000000000000000000003, ); runOnlyForDeploymentPostprocessing = 0; };
              A00000000000000000000009 = {isa = PBXGroup; children = (A00000000000000000000010, A00000000000000000000011, A00000000000000000000012, ); sourceTree = "<group>"; };
              A00000000000000000000010 = {isa = PBXGroup; children = (A00000000000000000000005, A00000000000000000000006, ); path = Sources; sourceTree = "<group>"; };
              A00000000000000000000011 = {isa = PBXGroup; children = (A00000000000000000000002, A00000000000000000000004, ); name = Frameworks; sourceTree = "<group>"; };
              A00000000000000000000012 = {isa = PBXGroup; children = (A00000000000000000000007, ); name = Products; sourceTree = "<group>"; };
              A00000000000000000000013 = {isa = PBXNativeTarget; buildConfigurationList = A00000000000000000000014; buildPhases = (A00000000000000000000008, A00000000000000000000015, A00000000000000000000016, ); buildRules = (); dependencies = (); name = F1OOB; productName = F1OOB; productReference = A00000000000000000000007; productType = "com.apple.product-type.application"; };
              A00000000000000000000017 = {isa = PBXProject; attributes = {BuildIndependentTargetsInParallel = 1; LastUpgradeCheck = 1600; }; buildConfigurationList = A00000000000000000000018; compatibilityVersion = "Xcode 14.0"; developmentRegion = en; mainGroup = A00000000000000000000009; productRefGroup = A00000000000000000000012; projectDirPath = ""; projectRoot = ""; targets = (A00000000000000000000013, ); };
              A00000000000000000000016 = {isa = PBXResourcesBuildPhase; buildActionMask = 2147483647; files = (); runOnlyForDeploymentPostprocessing = 0; };
              A00000000000000000000015 = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = (A00000000000000000000023, ); runOnlyForDeploymentPostprocessing = 0; };
              A00000000000000000000019 = {isa = XCBuildConfiguration; buildSettings = {CLANG_ENABLE_MODULES = YES; CLANG_ENABLE_OBJC_ARC = YES; IPHONEOS_DEPLOYMENT_TARGET = 17.0; SDKROOT = iphoneos; }; name = Debug; };
              A00000000000000000000020 = {isa = XCBuildConfiguration; buildSettings = {CLANG_ENABLE_MODULES = YES; CLANG_ENABLE_OBJC_ARC = YES; IPHONEOS_DEPLOYMENT_TARGET = 17.0; SDKROOT = iphoneos; }; name = Release; };
              A00000000000000000000021 = {isa = XCBuildConfiguration; buildSettings = {CODE_SIGN_STYLE = Automatic; CURRENT_PROJECT_VERSION = 1; GENERATE_INFOPLIST_FILE = NO; INFOPLIST_FILE = Sources/Info.plist; IPHONEOS_DEPLOYMENT_TARGET = 17.0; LD_RUNPATH_SEARCH_PATHS = ("$(inherited)", "@executable_path/Frameworks", ); MARKETING_VERSION = 1.0; OTHER_LDFLAGS = ("$(inherited)", "-framework", "UIKit", "-framework", "Metal", ); PRODUCT_BUNDLE_IDENTIFIER = com.jasonquiles.F1OOB.1.8SWJXLX2V6; PRODUCT_NAME = "$(TARGET_NAME)"; TARGETED_DEVICE_FAMILY = "1,2"; }; name = Debug; };
              A00000000000000000000022 = {isa = XCBuildConfiguration; buildSettings = {CODE_SIGN_STYLE = Automatic; CURRENT_PROJECT_VERSION = 1; GENERATE_INFOPLIST_FILE = NO; INFOPLIST_FILE = Sources/Info.plist; IPHONEOS_DEPLOYMENT_TARGET = 17.0; LD_RUNPATH_SEARCH_PATHS = ("$(inherited)", "@executable_path/Frameworks", ); MARKETING_VERSION = 1.0; OTHER_LDFLAGS = ("$(inherited)", "-framework", "UIKit", "-framework", "Metal", ); PRODUCT_BUNDLE_IDENTIFIER = com.jasonquiles.F1OOB.1.8SWJXLX2V6; PRODUCT_NAME = "$(TARGET_NAME)"; TARGETED_DEVICE_FAMILY = "1,2"; }; name = Release; };
              A00000000000000000000014 = {isa = XCConfigurationList; buildConfigurations = (A00000000000000000000021, A00000000000000000000022, ); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
              A00000000000000000000018 = {isa = XCConfigurationList; buildConfigurations = (A00000000000000000000019, A00000000000000000000020, ); defaultConfigurationIsVisible = 0; defaultConfigurationName = Release; };
            };
            rootObject = A00000000000000000000017;
          }
          PBXEOF

      - name: Build iOS app
        run: |
          set -euo pipefail
          xcodebuild -project F1OOB.xcodeproj -scheme F1OOB -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$GITHUB_WORKSPACE/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build -type d -name F1OOB.app -path '*/Release-iphoneos/*' -print -quit)"
          test -n "$APP_PATH" || { echo "ERROR: F1OOB.app was not produced"; exit 1; }
          rm -rf ipa
          mkdir -p ipa/Payload
          ditto "$APP_PATH" ipa/Payload/F1OOB.app
          (cd ipa && /usr/bin/zip -qry ../F1OOB-unsigned.ipa Payload)
          test -s F1OOB-unsigned.ipa
          ls -lh F1OOB-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: F1OOB-unsigned-IPA
          path: F1OOB-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
