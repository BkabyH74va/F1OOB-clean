name: Build F1OOB IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build for iOS
      run: |
        xcodebuild \
          -project F1OOB.xcodeproj \
          -scheme F1OOB \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -derivedDataPath DerivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          build
    
    - name: Find app
      run: |
        APP_PATH=$(find DerivedData -name "*.app" -type d | head -1)
        if [ -z "$APP_PATH" ]; then
          echo "Error: No .app found"
          exit 1
        fi
        echo "Found: $APP_PATH"
        echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
    
    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -r F1OOB-unsigned.ipa Payload/
        rm -rf Payload
        ls -lh F1OOB-unsigned.ipa
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: F1OOB-unsigned-ipa
        path: F1OOB-unsigned.ipa
        retention-days: 7
