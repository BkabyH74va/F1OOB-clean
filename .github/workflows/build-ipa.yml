name: Build F1OOB IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Show repository contents
      run: |
        echo "=== Repository structure ==="
        ls -la
        echo ""
        echo "=== Sources directory ==="
        ls -la Sources/ 2>/dev/null || echo "No Sources directory"
        echo ""
        echo "=== All files ==="
        find . -type f -not -path './.git/*' | head -50
    
    - name: Create Xcode project if none exists
      run: |
        # Check if project already exists
        if find . -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "Package.swift" | grep -q .; then
          echo "Xcode project already exists, skipping creation"
          exit 0
        fi
        
        echo "No Xcode project found, creating minimal project..."
        
        # Create project directory
        mkdir -p F1OOB.xcodeproj
        
        # Create project.pbxproj (minimal iOS app project)
        cat > F1OOB.xcodeproj/project.pbxproj << 'EOF'
