name: Build F1OOB IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # Use macos-latest (currently macos-14 Intel) - most available runner
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Select Xcode version
      run: |
        sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
        xcodebuild -version
    
    - name: Install dependencies
      run: |
        brew update
        brew install ldid dpkg
    
    - name: Build for iOS (Unsigned)
      run: |
        xcodebuild \
          -project F1OOB.xcodeproj \
          -scheme F1OOB \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -derivedDataPath DerivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          EXPANDED_CODE_SIGN_IDENTITY="" \
          build
    
    - name: Find and verify app
      run: |
        APP_PATH=$(find DerivedData -name "F1OOB.app" -type d | head -1)
        if [ -z "$APP_PATH" ]; then
          echo "Error: F1OOB.app not found"
          exit 1
        fi
        echo "Found app at: $APP_PATH"
        ls -la "$APP_PATH"
    
    - name: Create IPA
      run: |
        APP_PATH=$(find DerivedData -name "F1OOB.app" -type d | head -1)
        
        # Create Payload directory
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        
        # Create IPA (unsigned)
        zip -r F1OOB-unsigned.ipa Payload/
        
        # Cleanup
        rm -rf Payload
        
        # Verify IPA
        ls -lh F1OOB-unsigned.ipa
    
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: F1OOB-unsigned-ipa
        path: F1OOB-unsigned.ipa
        retention-days: 7
    
    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          DerivedData/Logs/Build/*.xcactivitylog
          DerivedData/Logs/Build/*.log
