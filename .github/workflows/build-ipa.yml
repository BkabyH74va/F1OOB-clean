name: Build F1OOB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.0'
    
    - name: Install dependencies
      run: |
        brew install ldid
        brew install dpkg
    
    - name: Setup signing
      env:
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
      run: |
        # Create keychain
        security create-keychain -p "github" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "github" build.keychain
        
        # Import certificate (if provided)
        if [ ! -z "$P12_PASSWORD" ]; then
          echo "${{ secrets.P12_CERTIFICATE }}" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
        fi
        
        # Install provisioning profile (if provided)
        if [ ! -z "$PROVISIONING_PROFILE" ]; then
          echo "$PROVISIONING_PROFILE" | base64 -d > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
        fi
    
    - name: Build for iOS
      run: |
        xcodebuild -project F1OOB.xcodeproj \
          -scheme F1OOB \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -derivedDataPath DerivedData \
          CODE_SIGN_IDENTITY="Apple Development" \
          CODE_SIGNING_REQUIRED=YES \
          CODE_SIGNING_ALLOWED=YES \
          DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM }}" \
          PROVISIONING_PROFILE_SPECIFIER="${{ secrets.PROVISIONING_PROFILE_NAME }}" \
          build
    
    - name: Package IPA
      run: |
        # Find the app
        APP_PATH=$(find DerivedData -name "F1OOB.app" -type d | head -1)
        echo "Found app at: $APP_PATH"
        
        # Create Payload directory
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        
        # Zip to IPA
        zip -r F1OOB.ipa Payload/
        
        # Also create unsigned version with ldid
        cp F1OOB.ipa F1OOB-unsigned.ipa
    
    - name: Upload IPA
      uses: actions/upload-artifact@v3
      with:
        name: F1OOB-IPA
        path: |
          F1OOB.ipa
          F1OOB-unsigned.ipa
    
    - name: Upload crash symbols
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: crash-symbols
        path: DerivedData/**/*.dsym
