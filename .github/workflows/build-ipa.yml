name: Build F1OOB IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "Sources/**"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          
          mkdir -p F1OOB.xcodeproj
          
          cat > F1OOB.xcodeproj/project.pbxproj << 'PBXEOF'
          // !$*UTF8*$!
          {
          	archiveVersion = 1;
          	classes = {
          	};
          	objectVersion = 56;
          	objects = {
          /* Begin PBXBuildFile section */
          		AA0000000000000000000001 /* main.m in Sources */ = {isa = PBXBuildFile; fileRef = AA0000000000000000000002 /* main.m */; };
          		AA0000000000000000000019 /* IOSurface.framework in Frameworks */ = {isa = PBXBuildFile; fileRef = AA0000000000000000000020 /* IOSurface.framework */; };
          /* End PBXBuildFile section */
          /* Begin PBXFileReference section */
          		AA0000000000000000000002 /* main.m */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.c.objc; path = main.m; sourceTree = "<group>"; };
          		AA0000000000000000000003 /* Info.plist */ = {isa = PBXFileReference; lastKnownFileType = text.plist.xml; path = Info.plist; sourceTree = "<group>"; };
          		AA0000000000000000000004 /* F1OOB.app */ = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = F1OOB.app; sourceTree = BUILT_PRODUCTS_DIR; };
          		AA0000000000000000000020 /* IOSurface.framework */ = {isa = PBXFileReference; lastKnownFileType = wrapper.framework; name = IOSurface.framework; path = System/Library/PrivateFrameworks/IOSurface.framework; sourceTree = SDKROOT; };
          /* End PBXFileReference section */
          /* Begin PBXFrameworksBuildPhase section */
          		AA0000000000000000000005 /* Frameworks */ = {
          			isa = PBXFrameworksBuildPhase;
          			buildActionMask = 2147483647;
          			files = (
          				AA0000000000000000000019 /* IOSurface.framework in Frameworks */,
          			);
          			runOnlyForDeploymentPostprocessing = 0;
          		};
          /* End PBXFrameworksBuildPhase section */
          /* Begin PBXGroup section */
          		AA0000000000000000000006 = {
          			isa = PBXGroup;
          			children = (
          				AA0000000000000000000007 /* Sources */,
          				AA0000000000000000000008 /* Products */,
          				AA0000000000000000000021 /* Frameworks */,
          			);
          			sourceTree = "<group>";
          		};
          		AA0000000000000000000007 /* Sources */ = {
          			isa = PBXGroup;
          			children = (
          				AA0000000000000000000002 /* main.m */,
          				AA0000000000000000000003 /* Info.plist */,
          			);
          			path = Sources;
          			sourceTree = "<group>";
          		};
          		AA0000000000000000000008 /* Products */ = {
          			isa = PBXGroup;
          			children = (
          				AA0000000000000000000004 /* F1OOB.app */,
          			);
          			name = Products;
          			sourceTree = "<group>";
          		};
          		AA0000000000000000000021 /* Frameworks */ = {
          			isa = PBXGroup;
          			children = (
          				AA0000000000000000000020 /* IOSurface.framework */,
          			);
          			name = Frameworks;
          			sourceTree = "<group>";
          		};
          /* End PBXGroup section */
          /* Begin PBXNativeTarget section */
          		AA0000000000000000000009 /* F1OOB */ = {
          			isa = PBXNativeTarget;
          			buildConfigurationList = AA0000000000000000000010 /* Build configuration list for PBXNativeTarget "F1OOB" */;
          			buildPhases = (
          				AA0000000000000000000011 /* Sources */,
          				AA0000000000000000000005 /* Frameworks */,
          				AA0000000000000000000012 /* Resources */,
          			);
          			buildRules = (
          			);
          			dependencies = (
          			);
          			name = F1OOB;
          			productName = F1OOB;
          			productReference = AA0000000000000000000004 /* F1OOB.app */;
          			productType = "com.apple.product-type.application";
          		};
          /* End PBXNativeTarget section */
          /* Begin PBXProject section */
          		AA0000000000000000000013 /* Project object */ = {
          			isa = PBXProject;
          			attributes = {
          				BuildIndependentTargetsInParallel = 1;
          				LastUpgradeCheck = 1500;
          				TargetAttributes = {
          					AA0000000000000000000009 = {
          						CreatedOnToolsVersion = 15.0;
          					};
          				};
          			};
          			buildConfigurationList = AA0000000000000000000014 /* Build configuration list for PBXProject "F1OOB" */;
          			compatibilityVersion = "Xcode 14.0";
          			developmentRegion = en;
          			hasScannedForEncodings = 0;
          			knownRegions = (
          				en,
          				Base,
          			);
          			mainGroup = AA0000000000000000000006;
          			productRefGroup = AA0000000000000000000008 /* Products */;
          			projectDirPath = "";
          			projectRoot = "";
          			targets = (
          				AA0000000000000000000009 /* F1OOB */,
          			);
          		};
          /* End PBXProject section */
          /* Begin PBXResourcesBuildPhase section */
          		AA0000000000000000000012 /* Resources */ = {
          			isa = PBXResourcesBuildPhase;
          			buildActionMask = 2147483647;
          			files = (
          			);
          			runOnlyForDeploymentPostprocessing = 0;
          		};
          /* End PBXResourcesBuildPhase section */
          /* Begin PBXSourcesBuildPhase section */
          		AA0000000000000000000011 /* Sources */ = {
          			isa = PBXSourcesBuildPhase;
          			buildActionMask = 2147483647;
          			files = (
          				AA0000000000000000000001 /* main.m in Sources */,
          			);
          			runOnlyForDeploymentPostprocessing = 0;
          		};
          /* End PBXSourcesBuildPhase section */
          /* Begin XCBuildConfiguration section */
          		AA0000000000000000000015 /* Debug */ = {
          			isa = XCBuildConfiguration;
          			buildSettings = {
          				ALWAYS_SEARCH_USER_PATHS = NO;
          				CLANG_ENABLE_MODULES = YES;
          				CLANG_ENABLE_OBJC_ARC = YES;
          				COPY_PHASE_STRIP = NO;
          				DEBUG_INFORMATION_FORMAT = dwarf;
          				ENABLE_TESTABILITY = YES;
          				GCC_DYNAMIC_NO_PIC = NO;
          				GCC_OPTIMIZATION_LEVEL = 0;
          				GCC_PREPROCESSOR_DEFINITIONS = (
          					"DEBUG=1",
          					"$(inherited)",
          				);
          				IPHONEOS_DEPLOYMENT_TARGET = 17.0;
          				ONLY_ACTIVE_ARCH = YES;
          				SDKROOT = iphoneos;
          			};
          			name = Debug;
          		};
          		AA0000000000000000000016 /* Release */ = {
          			isa = XCBuildConfiguration;
          			buildSettings = {
          				ALWAYS_SEARCH_USER_PATHS = NO;
          				CLANG_ENABLE_MODULES = YES;
          				CLANG_ENABLE_OBJC_ARC = YES;
          				COPY_PHASE_STRIP = NO;
          				DEBUG_INFORMATION_FORMAT = "dwarf-with-dsym";
          				ENABLE_NS_ASSERTIONS = NO;
          				IPHONEOS_DEPLOYMENT_TARGET = 17.0;
          				SDKROOT = iphoneos;
          				VALIDATE_PRODUCT = YES;
          			};
          			name = Release;
          		};
          		AA0000000000000000000017 /* Debug */ = {
          			isa = XCBuildConfiguration;
          			buildSettings = {
          				CODE_SIGN_STYLE = Automatic;
          				CURRENT_PROJECT_VERSION = 1;
          				DEVELOPMENT_TEAM = "";
          				FRAMEWORK_SEARCH_PATHS = (
          					"$(inherited)",
          					"$(SDKROOT)/System/Library/PrivateFrameworks",
          				);
          				GENERATE_INFOPLIST_FILE = NO;
          				INFOPLIST_FILE = Sources/Info.plist;
          				IPHONEOS_DEPLOYMENT_TARGET = 17.0;
          				LD_RUNPATH_SEARCH_PATHS = (
          					"$(inherited)",
          					"@executable_path/Frameworks",
          				);
          				MARKETING_VERSION = 1.0;
          				PRODUCT_BUNDLE_IDENTIFIER = com.jasonquiles.F1OOB.1.8SWJXLX2V6;
          				PRODUCT_NAME = "$(TARGET_NAME)";
          				TARGETED_DEVICE_FAMILY = "1,2";
          			};
          			name = Debug;
          		};
          		AA0000000000000000000018 /* Release */ = {
          			isa = XCBuildConfiguration;
          			buildSettings = {
          				CODE_SIGN_STYLE = Automatic;
          				CURRENT_PROJECT_VERSION = 1;
          				DEVELOPMENT_TEAM = "";
          				FRAMEWORK_SEARCH_PATHS = (
          					"$(inherited)",
          					"$(SDKROOT)/System/Library/PrivateFrameworks",
          				);
          				GENERATE_INFOPLIST_FILE = NO;
          				INFOPLIST_FILE = Sources/Info.plist;
          				IPHONEOS_DEPLOYMENT_TARGET = 17.0;
          				LD_RUNPATH_SEARCH_PATHS = (
          					"$(inherited)",
          					"@executable_path/Frameworks",
          				);
          				MARKETING_VERSION = 1.0;
          				PRODUCT_BUNDLE_IDENTIFIER = com.jasonquiles.F1OOB.1.8SWJXLX2V6;
          				PRODUCT_NAME = "$(TARGET_NAME)";
          				TARGETED_DEVICE_FAMILY = "1,2";
          			};
          			name = Release;
          		};
          /* End XCBuildConfiguration section */
          /* Begin XCConfigurationList section */
          		AA0000000000000000000010 /* Build configuration list for PBXNativeTarget "F1OOB" */ = {
          			isa = XCConfigurationList;
          			buildConfigurations = (
          				AA0000000000000000000017 /* Debug */,
          				AA0000000000000000000018 /* Release */,
          			);
          			defaultConfigurationIsVisible = 0;
          			defaultConfigurationName = Release;
          		};
          		AA0000000000000000000014 /* Build configuration list for PBXProject "F1OOB" */ = {
          			isa = XCConfigurationList;
          			buildConfigurations = (
          				AA0000000000000000000015 /* Debug */,
          				AA0000000000000000000016 /* Release */,
          			);
          			defaultConfigurationIsVisible = 0;
          			defaultConfigurationName = Release;
          		};
          /* End XCConfigurationList section */
          	};
          	rootObject = AA0000000000000000000013 /* Project object */;
          }
          PBXEOF
          
          xcodebuild \
            -project F1OOB.xcodeproj \
            -scheme F1OOB \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          
          APP_PATH=$(find build -name "F1OOB.app" -type d -path "*/Release-iphoneos/*" | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            exit 1
          fi
          
          echo "Found app: $APP_PATH"
          
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/
          
          cd ipa
          zip -r ../F1OOB-unsigned.ipa Payload
          cd ..
          
          ls -lh F1OOB-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: F1OOB-unsigned-IPA
          path: F1OOB-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
