EOF
        
        echo "Created minimal Xcode project"
    
    - name: Build for iOS (Unsigned)
      run: |
        xcodebuild \
          -project F1OOB.xcodeproj \
          -scheme F1OOB \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -derivedDataPath DerivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          EXPANDED_CODE_SIGN_IDENTITY="" \
          build
    
    - name: Find and verify app
      run: |
        APP_PATH=$(find DerivedData -name "*.app" -type d | head -1)
        if [ -z "$APP_PATH" ]; then
          echo "Error: No .app bundle found"
          exit 1
        fi
        echo "Found app at: $APP_PATH"
        ls -la "$APP_PATH"
        echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
    
    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -r F1OOB-unsigned.ipa Payload/
        rm -rf Payload
        ls -lh F1OOB-unsigned.ipa
    
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: F1OOB-unsigned-ipa
        path: F1OOB-unsigned.ipa
        retention-days: 7
    
    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          DerivedData/Logs/Build/*.xcactivitylog
          DerivedData/Logs/Build/*.log
